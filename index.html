<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjetas</title>
    <link rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<main>

    <h1>Practical Time</h1>

    <section class="tarjetas">

        <article class="tarjeta">

            <div class="tarjeta__encabezado"></div>

            <div class="tarjeta__contenido">

                <img class="tarjeta__imagen"
                    src="img/john.jpg"
                    alt="Fotografía de John Doe">

                <h2 class="tarjeta__nombre">John Doe</h2>

                <p class="tarjeta__descripcion">
                    Lorem ipsum dolor sit amet, consectetur
                    adipisicing elit et cupiditate deleniti.
                </p>

            <div class="tarjeta__acciones">

                <i class="fa-solid fa-plus" aria-hidden="true"></i>

                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>

                <i class="fa-solid fa-envelope" aria-hidden="true"></i>

</div>

            </div>

            <footer class="tarjeta__redes">

    <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>

    <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>

    <i class="fa-brands fa-twitter" aria-hidden="true"></i>

    <i class="fa-brands fa-instagram" aria-hidden="true"></i>

</footer>

        </article>
<article class="tarjeta tarjeta--allison">

    <div class="tarjeta__encabezado"></div>

    <div class="tarjeta__contenido">

        <img class="tarjeta__imagen"
             src="img/allison.jpg"
             alt="Fotografía de Allison Walker">

        <h2 class="tarjeta__nombre">Allison Walker</h2>

        <p class="tarjeta__descripcion">
            Lorem ipsum dolor sit amet, consectetur
            adipisicing elit et cupiditate deleniti.
        </p>

        <div class="tarjeta__acciones">

            <i class="fa-solid fa-plus" aria-hidden="true"></i>

            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>

            <i class="fa-solid fa-envelope" aria-hidden="true"></i>

        </div>

    </div>

    <footer class="tarjeta__redes">

        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>

        <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>

        <i class="fa-brands fa-twitter" aria-hidden="true"></i>

        <i class="fa-brands fa-instagram" aria-hidden="true"></i>

    </footer>

</article>
    </section>

</main>

</body>

</html>
